<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Template for site/og.png (1200×630). Render: node scripts/make-og.mjs -->
<style>
  html, body { margin: 0; inline-size: 1200px; block-size: 630px; overflow: hidden; }
  body {
    background: #f6f5f2; color: #1c1d21; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: grid; grid-template-columns: 1fr 360px; align-items: center; padding: 0 80px; box-sizing: border-box;
  }
  h1 { font-size: 132px; margin: 0; letter-spacing: -.02em; line-height: 1; }
  p { font-size: 44px; margin: 24px 0 36px; color: #2f3b52; }
  .levels { display: flex; gap: 14px; flex-wrap: wrap; }
  .lv { font-size: 28px; font-weight: 700; padding: 6px 18px; border-radius: 999px; }
  .a { background: #d9f0e1; color: #14532d; } .m { background: #fbf0bf; color: #5f4500; }
  .g { background: #fddcbc; color: #7a2e0e; } .c { background: #f7c9c9; color: #7f1d1d; }
  .foot { font-size: 28px; color: #5d6068; margin-top: 36px; }
  svg { inline-size: 360px; block-size: 360px; }
</style>
</head>
<body>
  <div>
    <h1>מי עם מי</h1>
    <p>בנו קואליציה וגלו איפה היא תתפרק</p>
    <div class="levels">
      <span class="lv a">✓ מסכימות</span><span class="lv m">≈ פער קל</span><span class="lv g">≠ פער מהותי</span><span class="lv c">✕ סתירה חזיתית</span>
    </div>
    <div class="foot">14 מפלגות · 8 נושאים · מקור לכל עמדה</div>
  </div>
  <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="9" fill="#2f3b52"/><circle cx="20" cy="16" r="9" fill="#94a3b8" fill-opacity=".85"/></svg>
</body>
</html>
